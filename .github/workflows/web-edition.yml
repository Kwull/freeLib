name: web-edition

on:
  push:
    paths:
      - 'server/**'
      - 'web/**'
      - 'docker/**'
      - 'docs/web/**'
      - '.github/workflows/web-edition.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'web/**'
      - 'docker/**'
      - 'docs/web/**'
      - '.github/workflows/web-edition.yml'

# A newer push to the same branch supersedes an older run (and its image publish).
concurrency:
  group: web-edition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Check formatting
        working-directory: server
        run: cargo fmt --check

      - name: Placeholder web/dist for embedded SPA
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html

      - name: Clippy
        working-directory: server
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: server
        run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check
        working-directory: web
        run: pnpm check

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Playwright install
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        working-directory: web
        run: pnpm test

  docker:
    needs: [rust, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      # Build the full image for amd64 and smoke-test it on every run.
      - name: Build (amd64, full)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: full
          platforms: linux/amd64
          load: true
          tags: freelib:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          mkdir -p smoke/books smoke/data smoke/cache smoke/export
          sudo chown -R 1000:1000 smoke
          docker run -d --name freelib -p 8080:8080 \
            -v "$PWD/smoke/books:/books:ro" -v "$PWD/smoke/data:/data" \
            -v "$PWD/smoke/cache:/cache" -v "$PWD/smoke/export:/export" freelib:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' freelib)" = healthy ] && break
            sleep 2
          done
          docker inspect --format '{{.State.Health.Status}}' freelib | grep -qx healthy
          curl -fsS http://localhost:8080/api/v1/session
          curl -fsS http://localhost:8080/ | grep -qi '<!doctype html'
          curl -fsS http://localhost:8080/opds | grep -q '<feed'
          curl -fsSI http://localhost:8080/ | grep -qi '^content-security-policy:'
          # trixie's Calibre passes the server's version gate (>= 6.19)
          curl -fsS http://localhost:8080/api/v1/settings | grep -q '"available":true'
          docker exec freelib ebook-convert --version | head -1
          docker exec freelib freelib-server healthcheck

      - name: Container logs
        if: always()
        run: docker logs freelib || true

      - uses: docker/setup-qemu-action@v3
        if: env.PUBLISH == 'true'

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish full (multi-arch)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/freelib:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/freelib:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish slim (multi-arch)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/freelib:slim
          cache-from: type=gha
          cache-to: type=gha,mode=max
